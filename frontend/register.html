<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account – Secure Banking</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="card">
    <h2>Create Account</h2>
    <p class="subtitle">Open a new customer profile</p>

    <form id="register-form">
      <div class="input-group">
        <label>Full Name</label>
        <input
          type="text"
          id="reg-full-name"
          placeholder="John Doe"
          required
        >
      </div>

      <div class="input-group">
        <label>Email</label>
        <input
          type="email"
          id="reg-email"
          placeholder="john@example.com"
          required
        >
      </div>

      <div class="input-group">
        <label>Phone Number</label>
        <input
          type="text"
          id="reg-phone"
          placeholder="+961 71 234 567"
          required
        >
      </div>

      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          id="reg-password"
          placeholder="Strong password"
          required
        >
      </div>

      <button class="btn-primary" type="submit">Create account</button>
    </form>

    <p id="register-error" class="error"></p>
    <p id="register-success" class="success"></p>

    <div class="links">
      <a href="index.html">Already have an account? Log in</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
