<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard – Secure Banking</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <div class="card">
    <h2>Admin Dashboard</h2>
    <p class="subtitle">Manage user roles</p>

    <form id="role-form">
      <div class="input-group">
        <label>User ID</label>
        <input type="number" id="role-user-id" placeholder="e.g. 3" required>
      </div>

      <div class="input-group">
        <label>New Role</label>
        <select id="role-select">
          <option value="customer">Customer</option>
          <option value="support">Support</option>
          <option value="auditor">Auditor</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <button class="btn-primary" type="submit">
        Update Role
      </button>
    </form>

    <p id="role-error" class="error"></p>
    <p id="role-success" class="success"></p>

    <div class="links">
      <a href="index.html">Logout</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
