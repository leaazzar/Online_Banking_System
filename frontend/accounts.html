<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Accounts • BestBankk</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/modal.css" />

  <!-- Shared JS -->
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/sidebar.js"></script>
</head>

<body>
  <div class="layout">
    <!-- SIDEBAR -->
    <aside id="sidebar-container"></aside>

    <!-- MAIN -->
    <main class="main-content">
      <!-- NAVBAR -->
      <header id="navbar-container"></header>

      <!-- HEADER -->
      <div class="page-header">
        <h1 id="accounts-title">Your Accounts</h1>
        <p class="subtitle" id="accounts-subtitle">
          View your balances, account types, and manage your money.
        </p>
        <button id="open-account-btn" class="primary-btn" onclick="openAccountModal()">
          + Open New Account
        </button>
      </div>

      <!-- ACCOUNTS LIST -->
      <div id="accounts-container" class="card-grid"></div>
    </main>
  </div>

  <!-- CREATE ACCOUNT MODAL -->
  <div id="account-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">Open a New Account</h2>

      <!-- For admin: choose customer -->
      <div id="admin-owner-field" style="display: none; margin-bottom: 10px;">
        <label for="new-account-owner">Customer ID</label>
        <input
          id="new-account-owner"
          type="number"
          min="1"
          placeholder="Enter customer ID"
        />
      </div>

      <label for="new-account-type">Account Type</label>
      <select id="new-account-type">
        <option value="checking">Checking</option>
        <option value="savings">Savings</option>
      </select>

      <label for="new-account-balance">Opening Balance</label>
      <input
        id="new-account-balance"
        type="number"
        min="0"
        step="0.01"
        value="0"
      />

      <div class="modal-actions">
        <button class="secondary-btn" type="button" onclick="closeAccountModal()">
          Cancel
        </button>
        <button class="primary-btn" type="button" onclick="createAccount()">
          Create
        </button>
      </div>
    </div>
  </div>

  <script>
    // --------------------------
    // PAGE LOAD
    // --------------------------
    document.addEventListener("DOMContentLoaded", () => {
      const token = getAccessToken();
      if (!token) {
        window.location.href = "login.html";
        return;
      }

      const user = getCurrentUser();

      const titleEl = document.getElementById("accounts-title");
      const subtitleEl = document.getElementById("accounts-subtitle");
      const openBtn = document.getElementById("open-account-btn");
      const adminOwnerField = document.getElementById("admin-owner-field");
      const modalTitle = document.getElementById("modal-title");

      if (user && (user.role === "admin" || user.role === "support")) {
        // Admin/support view: all accounts
        titleEl.textContent = "All Accounts";
        subtitleEl.textContent = "View and manage all customer accounts.";

        if (user.role === "admin") {
          // Admin can create accounts for customers
          adminOwnerField.style.display = "block";
          modalTitle.textContent = "Open Account for Customer";
        } else {
          // Support cannot create accounts
          openBtn.style.display = "none";
        }
      }

      loadAccounts();
    });

    // --------------------------
    // LOAD ACCOUNTS
    // --------------------------
    async function loadAccounts() {
      const container = document.getElementById("accounts-container");
      container.innerHTML = "<p class='loading'>Loading accounts...</p>";

      try {
        const user = getCurrentUser();
        let accounts;

        if (user && (user.role === "admin" || user.role === "support")) {
          // Staff API → all accounts
          accounts = await staffApiGet("/admin/accounts");
        } else {
          // Customer API → only this user's accounts
          accounts = await apiGet("/accounts");
        }

        if (!accounts || accounts.length === 0) {
          container.innerHTML =
            "<p class='empty-msg'>No accounts found.</p>";
          return;
        }

        container.innerHTML = "";

        accounts.forEach((acc) => {
          const card = document.createElement("div");
          card.className = "account-card card";

          const balance = Number(acc.balance || 0).toFixed(2);
          const number = acc.account_number || acc.number || acc.id;
          const type = acc.type ? acc.type.toUpperCase() : "ACCOUNT";

          card.innerHTML = `
            <h3>${type}</h3>
            <p class="balance">$${balance}</p>
            <p class="status">
              <span>Account #${number}</span><br/>
              Status: <strong>${acc.status || "UNKNOWN"}</strong>
            </p>
          `;

          container.appendChild(card);
        });
      } catch (err) {
        console.error("Error loading accounts:", err);
        const container = document.getElementById("accounts-container");
        container.innerHTML =
          "<p class='error-msg'>Error loading accounts.</p>";
      }
    }

    // --------------------------
    // MODAL HELPERS
    // --------------------------
    function openAccountModal() {
      document.getElementById("account-modal").classList.remove("hidden");
    }

    function closeAccountModal() {
      document.getElementById("account-modal").classList.add("hidden");
    }

    // --------------------------
    // CREATE ACCOUNT
    // --------------------------
    async function createAccount() {
      const user = getCurrentUser();

      const typeEl = document.getElementById("new-account-type");
      const balanceEl = document.getElementById("new-account-balance");
      const ownerEl = document.getElementById("new-account-owner");

      const account_type = typeEl.value;
      const initial_deposit = parseFloat(balanceEl.value) || 0;

      try {
        if (user && user.role === "admin") {
          // Admin creates account for any customer via staff API
          const owner_id = parseInt(ownerEl.value);

          if (!owner_id || isNaN(owner_id)) {
            alert("Please enter a valid customer ID.");
            return;
          }

          await staffApiPost("/admin/accounts", {
            owner_id,
            type: account_type,
            opening_balance: initial_deposit,
          });
        } else if (user && user.role === "support") {
          alert("Support staff cannot create accounts.");
          return;
        } else {
          // Normal customer creates account for themselves (customer API)
          const result = await customerPost("/accounts/create", {
            account_type,
            initial_deposit,
          });

          // customerPost through authApiFetch already throws on non-2xx
          console.log("Customer account created:", result);
        }

        // Success
        closeAccountModal();
        loadAccounts();
      } catch (err) {
        console.error("Error creating account:", err);
        alert("Error creating account.\n\n" + (err.message || "Unknown error"));
      }
    }
  </script>
</body>
</html>
