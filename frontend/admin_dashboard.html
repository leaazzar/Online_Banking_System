<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>

  <link rel="stylesheet" href="css/global.css" />
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/navbar.js"></script>
</head>

<body>
<div class="layout">

  <div id="sidebar-container"></div>

  <div class="main-content">
    <div id="navbar-container"></div>

    <h1>Admin Dashboard</h1>
    <p class="page-subtitle">System overview and quick controls</p>

    <!-- STAT CARDS -->
    <div id="stats-container" class="card-grid"></div>

    <h2 class="section-title">Quick Actions</h2>

    <div class="quick-actions">
      <a href="manage_users.html" class="primary-btn">Manage Users</a>
      <a href="manage_accounts.html" class="secondary-btn">Manage Accounts</a>
      <a href="support_tickets.html" class="secondary-btn">Support Tickets</a>
      <a href="transactions.html" class="secondary-btn">Transactions</a>
      <a href="audit_logs.html" class="secondary-btn">Audit Logs</a>
      <a href="transfers.html" class="secondary-btn">Transfers</a>
      <a href="admin_transactions.html" class="secondary-btn">View All Transactions</a>
      <a href="accounts.html" class="secondary-btn">Account</a>
    </div>

  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", loadStats);

async function loadStats() {
  const box = document.getElementById("stats-container");
  box.innerHTML = "<p>Loading...</p>";

  try {
    // ⬅️ STAFF API (port 5003 + /staff), not customer API
    const data = await staffApiGet("/admin/overview");

    box.innerHTML = `
      <div class="stat-card">Total Users: <strong>${data.total_users}</strong></div>
      <div class="stat-card">Customers: <strong>${data.total_customers}</strong></div>
      <div class="stat-card">Staff: <strong>${data.total_staff}</strong></div>
      <div class="stat-card">Accounts: <strong>${data.total_accounts}</strong></div>
      <div class="stat-card">Active: <strong>${data.active_accounts}</strong></div>
      <div class="stat-card">Frozen: <strong>${data.frozen_accounts}</strong></div>
      <div class="stat-card">Closed: <strong>${data.closed_accounts}</strong></div>
      <div class="stat-card">Open Tickets: <strong>${data.open_tickets}</strong></div>
    `;
  } catch (err) {
    console.error("Failed to load overview:", err);
    box.innerHTML = "<p>Error loading stats.</p>";
  }
}
</script>

</body>
</html>
