<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>First Login – Admin Setup</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="card">
    <h2>Admin First Login</h2>
    <p class="subtitle">
      Update your email and password before using the system.
    </p>

    <form id="first-login-form">
      <div class="input-group">
        <label>New Email</label>
        <input
          type="email"
          id="fl-email"
          placeholder="admin@example.com"
          required
        >
      </div>

      <div class="input-group">
        <label>New Password</label>
        <input
          type="password"
          id="fl-password"
          placeholder="Strong password"
          required
        >
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <input
          type="password"
          id="fl-confirm-password"
          placeholder="Re-enter password"
          required
        >
      </div>

      <button class="btn-primary" type="submit">Save and continue</button>
    </form>

    <p id="fl-error" class="error"></p>
    <p id="fl-success" class="success"></p>

    <div class="links">
      <a href="index.html">Back to login</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
