<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Accounts • BestBankk</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/modal.css" />

  <!-- Shared JS -->
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/sidebar.js"></script>
</head>

<body>
  <div class="layout">
    <!-- SIDEBAR -->
    <aside id="sidebar-container"></aside>

    <!-- MAIN -->
    <main class="main-content">
      <!-- NAVBAR -->
      <header id="navbar-container"></header>

      <!-- HEADER -->
      <div class="page-header">
        <h1>Your Accounts</h1>
        <p class="subtitle">
          View your balances, account types, and manage your money.
        </p>
        <button class="primary-btn" onclick="openAccountModal()">
          + Open New Account
        </button>
      </div>

      <!-- ACCOUNTS LIST -->
      <div id="accounts-container" class="card-grid"></div>
    </main>
  </div>

  <!-- CREATE ACCOUNT MODAL -->
  <div id="account-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Open a New Account</h2>

      <label for="new-account-type">Account Type</label>
      <select id="new-account-type">
        <option value="checking">Checking</option>
        <option value="savings">Savings</option>
      </select>

      <label for="new-account-balance">Opening Balance</label>
      <input
        id="new-account-balance"
        type="number"
        min="0"
        step="0.01"
        value="0"
      />

      <div class="modal-actions">
        <button class="secondary-btn" type="button" onclick="closeAccountModal()">
          Cancel
        </button>
        <button class="primary-btn" type="button" onclick="createAccount()">
          Create
        </button>
      </div>
    </div>
  </div>

  <script>
    // --------------------------
    // PAGE LOAD
    // --------------------------
    document.addEventListener("DOMContentLoaded", () => {
      // if not logged in, send to login
      const token = getAccessToken();
      if (!token) {
        window.location.href = "login.html";
        return;
      }

      loadAccounts();
    });

    // --------------------------
    // LOAD ACCOUNTS
    // --------------------------
    async function loadAccounts() {
      const container = document.getElementById("accounts-container");
      container.innerHTML = "<p class='loading'>Loading accounts...</p>";

      try {
        const token = getAccessToken();
        const { status, data } = await customerGet("/accounts", token);

        if (status !== 200) {
          console.error("Failed to load accounts:", status, data);
          container.innerHTML =
            "<p class='error-msg'>Error loading accounts.</p>";
          return;
        }

        const accounts = data; // backend returns a plain list []

        if (!accounts || accounts.length === 0) {
          container.innerHTML =
            "<p class='empty-msg'>You have no accounts yet.</p>";
          return;
        }

        container.innerHTML = "";

        accounts.forEach((acc) => {
          const card = document.createElement("div");
          card.className = "account-card card";

          const balance = Number(acc.balance || 0).toFixed(2);

          card.innerHTML = `
            <h3>${acc.type ? acc.type.toUpperCase() : "ACCOUNT"}</h3>
            <p class="balance">$${balance}</p>
            <p class="status">
              <span>Account #${acc.account_number}</span><br/>
              Status: <strong>${acc.status}</strong>
            </p>
          `;

          container.appendChild(card);
        });
      } catch (err) {
        console.error("Error loading accounts:", err);
        const container = document.getElementById("accounts-container");
        container.innerHTML =
          "<p class='error-msg'>Error loading accounts.</p>";
      }
    }

    // --------------------------
    // MODAL HELPERS
    // --------------------------
    function openAccountModal() {
      document.getElementById("account-modal").classList.remove("hidden");
    }

    function closeAccountModal() {
      document.getElementById("account-modal").classList.add("hidden");
    }

    // --------------------------
    // CREATE ACCOUNT
    // --------------------------
    async function createAccount() {
      const typeEl = document.getElementById("new-account-type");
      const balanceEl = document.getElementById("new-account-balance");

      const account_type = typeEl.value;
      const initial_deposit = parseFloat(balanceEl.value) || 0;

      try {
        const token = getAccessToken();
        const { status, data } = await customerPost(
          "/accounts/create",
          { account_type, initial_deposit },
          token
        );

        if (status !== 201) {
          console.error("Create account failed:", status, data);
          alert(
            "Error creating account.\n\n" +
              (data.msg || data.error || `Status ${status}`)
          );
          return;
        }

        // Success
        closeAccountModal();
        loadAccounts();
      } catch (err) {
        console.error("Error creating account:", err);
        alert("Error creating account.\n\n" + err.message);
      }
    }
  </script>
</body>
</html>
