<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Transaction History</title>

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/sidebar.js"></script>

  <style>
    .filters-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .filters-box label {
      font-weight: 600;
      display: block;
      margin-top: 10px;
    }

    .transactions-grid {
      display: grid;
      gap: 16px;
      margin-top: 20px;
    }

    .transaction-card {
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    .txn-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .txn-type.debit {
      color: #d9534f;
      font-weight: 700;
    }

    .txn-type.credit {
      color: #2a9d34;
      font-weight: 700;
    }

    .no-results {
      text-align: center;
      padding: 20px;
      color: var(--text-light);
    }
  </style>
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <div id="sidebar-container"></div>

  <div class="main-content">

    <!-- NAVBAR -->
    <div id="navbar-container"></div>

    <div class="page-header">
      <h1>Transaction History</h1>
      <p>Review and filter all your account activity.</p>
    </div>

    <!-- FILTERS -->
    <div class="filters-box">
      <div class="filter-row">
        <label>Date From</label>
        <input type="date" id="filter-from">
      </div>

      <div class="filter-row">
        <label>Date To</label>
        <input type="date" id="filter-to">
      </div>

      <div class="filter-row">
        <label>Type</label>
        <select id="filter-type">
          <option value="">All</option>
          <option value="debit">Debit</option>
          <option value="credit">Credit</option>
        </select>
      </div>

      <div class="filter-row">
        <label>Min Amount</label>
        <input type="number" id="filter-min" placeholder="0" min="0">
      </div>

      <div class="filter-row">
        <label>Max Amount</label>
        <input type="number" id="filter-max" placeholder="10000" min="0">
      </div>

      <button class="primary-btn" style="margin-top: 16px;" onclick="applyFilters()">Apply Filters</button>
    </div>

    <!-- TRANSACTIONS LIST -->
    <div id="transactions-container" class="transactions-grid"></div>

  </div>
</div>

<script src="js/transactions.js"></script>

</body>
</html>
