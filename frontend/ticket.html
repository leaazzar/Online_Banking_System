<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Support Tickets</title>

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/sidebar.js"></script>

  <style>
    .ticket-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: var(--shadow);
      transition: 0.2s;
    }

    .ticket-card:hover {
      transform: scale(1.01);
    }

    .ticket-status {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
    }

    .status-open {
      background: #ffecd0;
      color: #c77d00;
    }

    .status-in_progress {
      background: #d8e7ff;
      color: #2a59c1;
    }

    .status-resolved {
      background: #dfffe4;
      color: #238b40;
    }

    .create-btn {
      margin-top: 10px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .hidden {
      display: none;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 350px;
      animation: pop 0.2s ease;
    }

    @keyframes pop {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
<div class="layout">

  <div id="sidebar-container"></div>

  <div class="main-content">

    <div id="navbar-container"></div>

    <div class="page-header">
      <h1>Support Tickets</h1>
      <p>Need help? Track and manage your support requests.</p>
      <button class="primary-btn create-btn" onclick="openTicketForm()">+ Open Ticket</button>
    </div>

    <div id="tickets-container" class="transactions-grid"></div>

  </div>
</div>

<!-- CREATE TICKET MODAL -->
<div id="ticket-modal" class="modal hidden">
  <div class="modal-content">
    <h2>Create Ticket</h2>

    <label>Subject</label>
    <input id="ticket-subject" type="text" placeholder="Enter subject">

    <label>Description</label>
    <textarea id="ticket-description" placeholder="Describe your issue" style="height:100px;"></textarea>

    <div class="modal-actions" style="margin-top: 16px; text-align: right;">
      <button class="secondary-btn" onclick="closeTicketForm()">Cancel</button>
      <button class="primary-btn" onclick="submitTicket()">Submit</button>
    </div>
  </div>
</div>

<script src="js/tickets.js"></script>
</body>
</html>
