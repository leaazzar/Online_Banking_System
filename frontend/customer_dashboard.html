<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Dashboard • BestBank</title>

  <link rel="stylesheet" href="css/global.css">
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth.js"></script>

  <style>
    body.dashboard-body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #f5f7fb;
      display: grid;
      grid-template-columns: 240px 1fr;
      grid-template-rows: 60px 1fr;
      grid-template-areas:
        "sidebar header"
        "sidebar main";
      height: 100vh;
    }

    .top-nav {
      grid-area: header;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: #ffffff;
      border-bottom: 1px solid #e0e3f0;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }

    .logo {
      font-weight: 700;
      font-size: 20px;
      color: #1a237e;
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: #475569;
    }

    .logout-btn {
      background: #ff4d4d;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    .logout-btn:hover {
      background: #e03535;
    }

    .side-menu {
      grid-area: sidebar;
      background: #101827;
      color: #e5e7eb;
      padding: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .side-menu .menu-item {
      display: block;
      padding: 10px 20px;
      font-size: 14px;
      text-decoration: none;
      color: #cbd5f5;
      border-left: 3px solid transparent;
      transition: 0.2s;
    }

    .side-menu .menu-item:hover {
      background: rgba(148, 163, 253, 0.08);
      color: #ffffff;
    }

    .side-menu .menu-item.active {
      background: rgba(59, 130, 246, 0.12);
      border-left-color: #3b82f6;
      color: #ffffff;
      font-weight: 600;
    }

    .main-content {
      grid-area: main;
      padding: 28px 32px;
      overflow-y: auto;
    }

    .main-content h1 {
      margin: 0;
      font-size: 26px;
      color: #111827;
    }

    .sub-text {
      margin-top: 6px;
      margin-bottom: 24px;
      color: #6b7280;
      font-size: 14px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.03);
      border: 1px solid #e5e7eb;
    }

    .card h2 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #374151;
      font-weight: 600;
    }

    .big-number {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: #1d4ed8;
    }
  </style>
</head>

<body class="dashboard-body">

  <!-- TOP NAVBAR -->
  <header class="top-nav">
    <div class="logo">BestBank</div>
    <div class="user-controls">
      <span id="user-name">Loading...</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- SIDE MENU -->
  <aside class="side-menu">
    <a href="customer_dashboard.html" class="menu-item active">📊 Dashboard</a>
    <a href="accounts.html" class="menu-item">💳 Accounts</a>
    <a href="transfers.html" class="menu-item">💸 Transfer Money</a>
    <a href="transactions.html" class="menu-item">📜 Transactions</a>
    <a href="ticket.html" class="menu-item">🎟 Support Tickets</a>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <h1>Welcome back</h1>
    <p class="sub-text">Here’s an overview of your accounts.</p>

    <div class="cards">
      <div class="card">
        <h2>Total Balance</h2>
        <p class="big-number" id="total-balance">$0.00</p>
      </div>

      <div class="card">
        <h2>Active Accounts</h2>
        <p class="big-number" id="active-accounts">0</p>
      </div>

      <div class="card">
        <h2>Recent Transactions</h2>
        <p class="big-number" id="recent-transactions">0</p>
      </div>
    </div>
  </main>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard_customer.js"></script>

</body>
</html>
